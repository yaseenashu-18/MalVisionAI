<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - MalVisionAI</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: #f3f4f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background: #fff;
            border-radius: 24px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.05);
            overflow: hidden;
            display: flex;
            width: 1000px;
            max-width: 95%;
            min-height: 600px;
        }

        .form-section {
            flex: 1;
            padding: 4rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .logo-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 2rem;
            color: #3b82f6;
            font-weight: 700;
            font-size: 1.2rem;
        }

        h2 {
            font-size: 2rem;
            margin-bottom: 0.5rem;
            color: #111827;
        }

        .subtitle {
            color: #6b7280;
            margin-bottom: 2.5rem;
            font-size: 0.95rem;
        }

        .input-group {
            margin-bottom: 1.2rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            color: #374151;
            font-size: 0.9rem;
            font-weight: 500;
        }

        input {
            width: 100%;
            padding: 0.8rem 1rem;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            font-size: 0.95rem;
            transition: all 0.2s;
            background: #f9fafb;
        }

        input:focus {
            outline: none;
            border-color: #3b82f6;
            background: #fff;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }

        .btn-primary {
            width: 100%;
            padding: 0.9rem;
            background: #000;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
            margin-bottom: 1rem;
        }

        .btn-primary:hover {
            opacity: 0.9;
        }

        .back-link {
            text-align: center;
            margin-top: 1rem;
            color: #6b7280;
            font-size: 0.9rem;
        }

        .back-link a {
            color: #111827;
            font-weight: 600;
            text-decoration: none;
        }

        .back-link a:hover {
            text-decoration: underline;
        }

        /* Right Side - Visual */
        .visual-section {
            flex: 1;
            background: #fff7ed;
            /* Very light orange base */
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(60px);
            opacity: 0.6;
        }

        .blob-1 {
            width: 300px;
            height: 300px;
            background: #fb923c;
            /* Orange */
            top: -50px;
            right: -50px;
        }

        .blob-2 {
            width: 400px;
            height: 400px;
            background: #f87171;
            /* Red */
            bottom: -50px;
            left: -50px;
        }

        .astronaut-img {
            width: 350px;
            max-width: 90%;
            z-index: 10;
            animation: float 6s ease-in-out infinite;
            filter: drop-shadow(0 20px 30px rgba(0, 0, 0, 0.15));
            transform: rotate(-10deg);
        }

        @keyframes float {
            0% {
                transform: translateY(0px) rotate(-10deg);
            }

            50% {
                transform: translateY(-20px) rotate(-10deg);
            }

            100% {
                transform: translateY(0px) rotate(-10deg);
            }
        }

        @media (max-width: 768px) {
            .container {
                flex-direction: column;
                height: auto;
            }

            .visual-section {
                display: none;
            }

            .form-section {
                padding: 2rem;
            }
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="form-section">
            <div class="logo-header">
                <div
                    style="background: #3b82f6; width: 24px; height: 24px; border-radius: 6px; display: flex; align-items: center; justify-content: center; color: white; font-size: 14px;">
                    <i class="fa-solid fa-shield-virus"></i>
                </div>
                MalVisionAI
            </div>

            <h2>Forgot Password?</h2>
            <p class="subtitle">Enter your email to receive a reset link.</p>

            <form action="/forgot-password" method="POST">
                {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                {% for category, message in messages %}
                <div style="padding: 10px; margin-bottom: 15px; border-radius: 6px; 
                                    background: {{ '#fed7d7' if category == 'error' else '#c6f6d5' }}; 
                                    color: {{ '#9b2c2c' if category == 'error' else '#22543d' }};">
                    {{ message }}
                </div>
                {% endfor %}
                {% endif %}
                {% endwith %}

                <div class="input-group">
                    <label>Email</label>
                    <input type="email" name="email" placeholder="name@example.com" required>
                </div>

                <button type="submit" class="btn-primary">Send Reset Link</button>
            </form>

            <p class="back-link">
                Remember your password? <a href="/login">Back to Login</a>
            </p>
        </div>

        <div class="visual-section">
            <div class="blob blob-1"></div>
            <div class="blob blob-2"></div>
            <!-- Using same astronaut placeholder style -->
            <img src="https://cdn3d.iconscout.com/3d/premium/thumb/astronaut-3774619-3153026.png" alt="Astronaut"
                class="astronaut-img">
        </div>
    </div>

</body>

</html>
