{% extends "base.html" %}

{% block content %}
<div class="contact-container"
    style="display: flex; justify-content: center; align-items: center; min-height: 80vh; padding: 2rem;">
    <div class="contact-card" style="
        display: flex; 
        flex-wrap: wrap; 
        max-width: 1000px; 
        width: 100%; 
        background: rgba(15, 23, 42, 0.6); 
        backdrop-filter: blur(12px); 
        border: 1px solid rgba(255, 255, 255, 0.1); 
        border-radius: 20px; 
        overflow: hidden; 
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);">

        <!-- Form Section -->
        <div class="contact-form-section" style="flex: 1; padding: 3rem; min-width: 300px;">
            <h2 style="font-family: 'Orbitron', sans-serif; color: white; font-size: 2.5rem; margin-bottom: 2rem;">
                Contact Us</h2>

            <form action="/contact" method="POST" style="display: flex; flex-direction: column; gap: 1.5rem;">

                <div class="input-group" style="display: flex; flex-direction: column; gap: 0.5rem;">
                    <label for="name" style="color: #94a3b8; font-size: 0.9rem; font-weight: 500;">Name</label>
                    <input type="text" id="name" name="name" placeholder="Your Name" required
                        style="background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); padding: 12px 16px; border-radius: 12px; color: white; font-family: 'Inter', sans-serif;">
                </div>

                <div class="input-group" style="display: flex; flex-direction: column; gap: 0.5rem;">
                    <label for="email" style="color: #94a3b8; font-size: 0.9rem; font-weight: 500;">Email</label>
                    <input type="email" id="email" name="email" placeholder="name@MalVisionAI.com" required
                        style="background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); padding: 12px 16px; border-radius: 12px; color: white; font-family: 'Inter', sans-serif;">
                </div>

                <div class="input-group" style="display: flex; flex-direction: column; gap: 0.5rem;">
                    <label for="message" style="color: #94a3b8; font-size: 0.9rem; font-weight: 500;">Message</label>
                    <textarea id="message" name="message" rows="4" placeholder="How can we help you?" required
                        style="background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); padding: 12px 16px; border-radius: 12px; color: white; font-family: 'Inter', sans-serif; resize: vertical;"></textarea>
                </div>

                <button type="submit" style="
                    background: #ec4899; 
                    color: white; 
                    border: none; 
                    padding: 12px 24px; 
                    border-radius: 50px; 
                    font-weight: 600; 
                    font-size: 1rem; 
                    cursor: pointer; 
                    transition: transform 0.2s, box-shadow 0.2s;
                    align-self: flex-start;
                    margin-top: 1rem;
                    box-shadow: 0 4px 14px 0 rgba(236, 72, 153, 0.39);"
                    onmouseover="this.style.transform='translateY(-2px)'; this.style.boxShadow='0 6px 20px rgba(236, 72, 153, 0.23)'"
                    onmouseout="this.style.transform='translateY(0)'; this.style.boxShadow='0 4px 14px 0 rgba(236, 72, 153, 0.39)'">
                    Submit
                </button>
            </form>
        </div>

        <!-- Illustration Section -->
        <div class="contact-visual-section" style="
            flex: 1; 
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.1), rgba(168, 85, 247, 0.1)); 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            padding: 2rem;
            min-width: 300px;">
            <img src="/static/images/contact_illustration.png" alt="Customer Support"
                style="max-width: 100%; height: auto; drop-shadow: 0 10px 20px rgba(0,0,0,0.3);">
        </div>
    </div>
</div>
{% endblock %}
