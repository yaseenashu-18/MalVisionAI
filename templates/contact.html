{% extends "base.html" %}

{% block content %}
<div class="contact-ultra-container" style="
    background: #F6F5F1;
    min-height: 100vh;
    padding: 8rem 2rem;
    color: #1C1C1C;
    font-family: 'Inter', sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
">
    <!-- Main Heading Section -->
    <div style="text-align: center; margin-bottom: 4rem;" class="fade-up">
        <h1 style="
            font-family: 'Playfair Display', serif;
            font-size: clamp(3.5rem, 8vw, 5.5rem);
            font-weight: 900;
            margin-bottom: 2rem;
            color: #1C1C1C;
            letter-spacing: -3px;
        ">Let's Build Together.</h1>
        <p style="
            font-size: 1.1rem;
            color: #666;
            max-width: 500px;
            margin: 0 auto;
            line-height: 1.6;
            font-weight: 500;
            letter-spacing: 0.5px;
        ">Experience elite cybersecurity solutions tailored for your peace of mind.</p>
    </div>

    <!-- Centered Form Container -->
    <div class="contact-card-glass fade-up" style="
        max-width: 850px;
        width: 100%;
        background: #FAFAF8;
        border: 1px solid rgba(28, 28, 28, 0.05);
        border-radius: 4px;
        padding: 5rem;
        color: #1C1C1C;
        box-shadow: 0 30px 60px rgba(0,0,0,0.05);
        display: flex;
        flex-direction: column;
        position: relative;
    ">
        <h2
            style="font-family: 'Playfair Display', serif; font-size: 1.8rem; font-weight: 900; margin-bottom: 4rem; text-align: left; text-transform: uppercase; letter-spacing: 1px;">
            Talk To Us</h2>

        <form action="/contact" method="POST" style="font-size: 1.3rem; line-height: 2.5; flex: 1;">
            <div style="margin-bottom: 2rem;">
                Hello, my name is
                <input type="text" name="name" placeholder="Name" required class="inline-input" style="width: 200px;">
                and my email address is
                <input type="email" name="email" placeholder="Email" required class="inline-input"
                    style="width: 250px;">.
                <br>
                I work at
                <input type="text" name="company" placeholder="Company" class="inline-input" style="width: 200px;">
                and I would like to chat about
                <textarea name="message" placeholder="how we can help you stay secure..." required
                    class="inline-textarea"></textarea>.
            </div>

            <div
                style="margin-top: 4rem; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 2rem;">
                <!-- CAPTCHA Placeholder -->
                <div
                    style="background: #f8fafc; border: 1px solid #e2e8f0; padding: 0.8rem 1.2rem; border-radius: 12px; display: flex; align-items: center; gap: 1rem;">
                    <input type="checkbox" id="robot" style="width: 22px; height: 22px; cursor: pointer;">
                    <label for="robot" style="font-size: 0.95rem; color: #64748b; cursor: pointer;">I'm not a
                        robot</label>
                    <img src="https://www.gstatic.com/recaptcha/api2/logo_48.png" alt="reCAPTCHA"
                        style="width: 24px; opacity: 0.7; margin-left: 1rem;">
                </div>

                <button type="submit" style="
                    background: #1C1C1C;
                    color: #F6F5F1;
                    border: none;
                    padding: 1.3rem 3.5rem;
                    border-radius: 4px;
                    font-weight: 800;
                    font-size: 0.9rem;
                    text-transform: uppercase;
                    letter-spacing: 2px;
                    cursor: pointer;
                    transition: all 0.3s ease;
                    box-shadow: 0 10px 20px rgba(28, 28, 28, 0.15);
                " onmouseover="this.style.background='#333'; this.style.transform='translateY(-3px)'"
                    onmouseout="this.style.background='#1C1C1C'; this.style.transform='translateY(0)'">
                    Send Message
                </button>
            </div>
        </form>

        <!-- Subtle Branding -->
        <div
            style="position: absolute; bottom: 2rem; right: 4.5rem; opacity: 0.1; font-weight: 800; letter-spacing: 2px; font-size: 0.8rem; pointer-events: none;">
            MALVISION AI PROTOCOL
        </div>
    </div>
</div>

<style>
    .inline-input {
        background: transparent;
        border: none;
        border-bottom: 1px solid #1C1C1C;
        padding: 0 5px;
        color: #1C1C1C;
        font-size: inherit;
        font-family: inherit;
        transition: all 0.3s ease;
        text-align: center;
        border-radius: 0;
    }

    .inline-input::placeholder {
        color: #BBB;
        font-weight: 400;
        font-style: normal;
    }

    .inline-input:focus {
        outline: none;
        border-bottom-width: 2px;
        background: transparent;
    }

    .inline-textarea {
        background: #F6F5F1;
        border: 1px solid rgba(28, 28, 28, 0.1);
        border-radius: 4px;
        padding: 20px;
        color: #1C1C1C;
        font-size: 1.15rem;
        font-family: inherit;
        width: 100%;
        min-height: 120px;
        margin-top: 20px;
        resize: vertical;
        transition: all 0.3s ease;
        line-height: 1.6;
    }

    .inline-textarea:focus {
        outline: none;
        border-color: #1C1C1C;
        box-shadow: none;
    }

    @media (max-width: 768px) {
        .contact-ultra-container {
            padding: 4rem 1.5rem;
        }

        .contact-card-glass {
            padding: 2.5rem !important;
            border-radius: 30px;
        }

        .inline-input {
            width: 100% !important;
            margin: 10px 0;
            text-align: left;
        }

        form {
            font-size: 1.1rem !important;
            line-height: normal !important;
        }
    }
</style>
{% endblock %}
